<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberpunk Glitch Card</title>
    <link rel="stylesheet" href="static/style.css">
</head>
<body>

    <div class="cyber-card">
        <!-- Декоративные хакерские элементы -->
        <div class="glitch-bg"></div>
        <div class="corner-tag">SYS_ERR // 404</div>

        <!-- Заголовок с глитч-эффектом (атрибуты data-text нужны для CSS) -->
        <h1 class="glitch-title" data-text="NEO-TOKYO">NEO-TOKYO</h1>

        <p class="cyber-text">
            Добро пожаловать в цифровое подполье. Доступ заблокирован, но вы можете активировать терминал.
        </p>

        <!-- Киберпанк-кнопка -->
        <button class="cyber-btn">
            ВЗЛОМАТЬ СИСТЕМУ<span class="btn-glitch"></span>
        </button>
    </div>

</body>
</html>
