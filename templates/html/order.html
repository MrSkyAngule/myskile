{% extends "base.html" %}
{% load static %}

{% block content %}
<!-- Подключаем стили витрины -->
<link rel="stylesheet" href="{% static 'style.css' %}">

<section class="py-12 max-w-7xl mx-auto px-4">
    <!-- Заголовок страницы -->
    <div class="text-center mb-12">
        <h1 class="text-3xl md:text-4xl font-extrabold text-gray-900 mb-3">Наши предложения</h1>
        <p class="text-lg text-gray-500 max-w-2xl mx-auto">Выберите подходящий тип сайта или сопутствующую услугу для вашего бизнеса.</p>
    </div>

    <!-- Чистая сетка из 15 ячеек без каких-либо форм вокруг -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="services-grid">
        <!-- Ячейки генерируются динамически из JS файла -->
    </div>
</section>

<!-- Подключаем логику рендеринга предложений -->
<script src="{% static 'script.js' %}"></script>
{% endblock %}
