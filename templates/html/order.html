{% extends "base.html" %}

{% block content %}
<section class="py-12 max-w-xl mx-auto px-4">
    <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100">
        <h1 class="text-3xl font-bold text-gray-900 mb-2 text-center">Обсудим ваш проект</h1>
        <p class="text-gray-500 text-center mb-8">Заполните форму, и мы свяжемся с вами в течение часа для расчета стоимости.</p>

        <form action="/order" method="POST" class="space-y-6">
            <!-- Имя -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Ваше имя</label>
                <input type="text" name="name" required placeholder="Иван" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:border-blue-500 transition">
            </div>

            <!-- Контакты -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Телефон или Telegram</label>
                <input type="text" name="contact" required placeholder="+7 (999) 000-00-00 или @username" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:border-blue-500 transition">
            </div>

            <!-- Выбор типа сайта -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Какой сайт вам нужен?</label>
                <select name="site_type" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:border-blue-500 transition bg-white">
                    <option value="landing">Лендинг</option>
                    <option value="corporate">Сайт компании</option>
                    <option value="shop">Интернет-магазин</option>
                    <option value="other">Другое / Нужна консультация</option>
                </select>
            </div>

            <!-- Детали -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Расскажите кратко о проекте</label>
                <textarea name="details" rows="4" placeholder="Сфера бизнеса, примеры сайтов..." class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:border-blue-500 transition resize-none"></textarea>
            </div>

            <!-- Кнопка отправки -->
            <button type="submit" class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl hover:bg-blue-700 transition shadow-lg shadow-blue-100">
                Отправить заявку
            </button>
        </form>
    </div>
</section>
{% endblock %}
