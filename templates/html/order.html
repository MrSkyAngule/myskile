{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Наши предложения — WebCraft</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>

    <header>
        <div class="container">
            <strong>WebCraft.</strong>
            <nav>
                <a href="/">Главная</a>
                <a href="orders" class="active">Предложения</a>
            </nav>
        </div>
    </header>

    <main>
        <div class="container">
            <h1>Наши предложения</h1>

            <div class="services-grid">
                {% for card in cards %}
                <div class="card">
                    <div>
                        <!-- Название -->
                        <h3>{{ card.title }}</h3>
                        <!-- Описание мини -->
                        <p>{{ card.description }}</p>
                    </div>
                    <div class="card-footer">
                        <!-- Цена -->
                        <span class="price">{{ card.price }} ₽</span>

                        <!-- Передаем card.id в ваш service_detail -->
                        <a href="{% url 'service_detail' card.id %}" class="btn-primary">Подробнее</a>
                    </div>
                </div>
                {% empty %}
                <p>В данный момент предложений нет.</p>
                {% endfor %}
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 WebCraft.</p>
        </div>
    </footer>

</body>
</html>
