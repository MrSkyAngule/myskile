{% extends "base.html" %}

{% block content %}
<section class="py-12 max-w-2xl mx-auto px-4">
    <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100">
        <h1 class="text-3xl font-bold text-gray-900 mb-2 text-center">Обсудим ваш проект</h1>
        <p class="text-gray-500 text-center mb-8">Заполните детали, и мы подготовим персональное коммерческое предложение.</p>

        <form action="/order" method="POST" class="space-y-6">
            <!-- Имя -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Ваше имя</label>
                <input type="text" name="name" required placeholder="Иван" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:border-blue-500 transition">
            </div>

            <!-- Контакты -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Телефон или Telegram</label>
                <input type="text" name="contact" required placeholder="+7 (999) 000-00-00 или @username" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:border-blue-500 transition">
            </div>

            <!-- ИНТЕРАКТИВНЫЙ ВЫБОР УСЛУГИ -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-3">Какой тип сайта вам необходим?</label>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">

                    <!-- Вариант 1: Лендинг -->
                    <label class="relative border border-gray-200 rounded-xl p-4 flex flex-col justify-between cursor-pointer hover:border-blue-500 transition has-[:checked]:border-blue-600 has-[:checked]:bg-blue-50/50">
                        <input type="radio" name="site_type" value="landing" checked class="absolute top-4 right-4 accent-blue-600">
                        <span class="text-2xl mb-2 block">📄</span>
                        <div>
                            <span class="block font-bold text-gray-800 text-sm">Лендинг</span>
                            <span class="text-xs text-gray-500">от 15 000 ₽</span>
                        </div>
                    </label>

                    <!-- Вариант 2: Сайт компании -->
                    <label class="relative border border-gray-200 rounded-xl p-4 flex flex-col justify-between cursor-pointer hover:border-blue-500 transition has-[:checked]:border-blue-600 has-[:checked]:bg-blue-50/50">
                        <input type="radio" name="site_type" value="corporate" class="absolute top-4 right-4 accent-blue-600">
                        <span class="text-2xl mb-2 block">🏢</span>
                        <div>
                            <span class="block font-bold text-gray-800 text-sm">Сайт компании</span>
                            <span class="text-xs text-gray-500">от 35 000 ₽</span>
                        </div>
                    </label>

                    <!-- Вариант 3: Магазин -->
                    <label class="relative border border-gray-200 rounded-xl p-4 flex flex-col justify-between cursor-pointer hover:border-blue-500 transition has-[:checked]:border-blue-600 has-[:checked]:bg-blue-50/50">
                        <input type="radio" name="site_type" value="shop" class="absolute top-4 right-4 accent-blue-600">
                        <span class="text-2xl mb-2 block">🛒</span>
                        <div>
                            <span class="block font-bold text-gray-800 text-sm">Магазин</span>
                            <span class="text-xs text-gray-500">от 60 000 ₽</span>
                        </div>
                    </label>

                </div>
            </div>

            <!-- Детали -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Краткое описание задачи (необязательно)</label>
                <textarea name="details" rows="4" placeholder="Например: нужен сайт для автосервиса, нравятся минималистичные дизайны..." class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:border-blue-500 transition resize-none"></textarea>
            </div>

            <!-- Кнопка отправки -->
            <button type="submit" class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl hover:bg-blue-700 transition shadow-lg shadow-blue-100 text-center">
                Отправить заявку
            </button>
        </form>
    </div>
</section>
{% endblock %}
