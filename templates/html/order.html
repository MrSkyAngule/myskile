{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Наши предложения — WebCraft</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>

    <header>
        <div class="container">
            <strong>WebCraft.</strong>
            <nav>
                <a href="/">Главная</a>
                <a href="orders" class="active">Предложения</a>
            </nav>
        </div>
    </header>

    <main>
        <div class="container">
            <h1>Наши предложения</h1>
                <div class="filter-bar" style="background-color: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 15px 20px; margin-bottom: 30px; display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap;">

                <div style="display: flex; align-items: center; gap: 10px;">
                    <!-- Иконка или текст направления -->
                    <span style="font-size: 0.9rem; font-weight: 700; color: #0f172a; text-transform: uppercase; letter-spacing: 0.5px;">Фильтр услуг:</span>
                </div>

                <!-- Выпадающий список (Селектор) -->
                <div style="flex-grow: 1; max-width: 350px; width: 100%;">
                    <select onchange="location = this.value;" style="width: 100%; padding: 10px 16px; font-size: 0.95rem; font-weight: 500; color: #1e293b; background-color: #f8fafc; border: 1px solid #cbd5e1; border-radius: 8px; outline: none; cursor: pointer; transition: border-color 0.2s;">

                        <!-- Опция "Все услуги" -->
                        <option value="{% url 'order' %}" {% if not selected_tag %}selected{% endif %}>
                            📂 Все направления разработки
                        </option>

                        <!-- Динамический список тегов из базы данных -->
                        {% for tag in tags %}
                            <option value="{% url 'order' %}?tag={{ tag.slug }}" {% if selected_tag == tag.slug %}selected{% endif %}>
                                🏷️ {{ tag.name }}
                            </option>
                        {% endfor %}

                    </select>
                </div>
                </div><div class="filter-bar" style="background-color: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 15px 20px; margin-bottom: 30px; display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap;">

                <div style="display: flex; align-items: center; gap: 10px;">
                    <!-- Иконка или текст направления -->
                    <span style="font-size: 0.9rem; font-weight: 700; color: #0f172a; text-transform: uppercase; letter-spacing: 0.5px;">Фильтр услуг:</span>
                </div>

                <!-- Выпадающий список (Селектор) -->
                <div style="flex-grow: 1; max-width: 350px; width: 100%;">
                    <select onchange="location = this.value;" style="width: 100%; padding: 10px 16px; font-size: 0.95rem; font-weight: 500; color: #1e293b; background-color: #f8fafc; border: 1px solid #cbd5e1; border-radius: 8px; outline: none; cursor: pointer; transition: border-color 0.2s;">

                        <!-- Опция "Все услуги" -->
                        <option value="{% url 'order' %}" {% if not selected_tag %}selected{% endif %}>
                            📂 Все направления разработки
                        </option>

                        <!-- Динамический список тегов из базы данных -->
                        {% for tag in tags %}
                            <option value="{% url 'order' %}?tag={{ tag.slug }}" {% if selected_tag == tag.slug %}selected{% endif %}>
                                🏷️ {{ tag.name }}
                            </option>
                        {% endfor %}

                    </select>
                </div>
            </div>

            <div class="services-grid">
                {% for card in cards %}
                <div class="card">
                    <div>
                        <!-- Название -->
                        <h3>{{ card.title }}</h3>
                        <!-- Описание мини -->
                        <p>{{ card.description }}</p>
                    </div>
                    <div class="card-footer">
                        <!-- Цена -->
                        <span class="price">{{ card.price }} ₽</span>

                        <!-- Передаем card.id в ваш service_detail -->
                        <a href="{% url 'service_detail' card.id %}" class="btn-primary">Подробнее</a>
                    </div>
                </div>
                {% empty %}
                <p>В данный момент предложений нет.</p>
                {% endfor %}
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 WebCraft.</p>
        </div>
    </footer>

</body>
</html>
